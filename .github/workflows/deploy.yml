name: Sync with Upstream

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout forked repository
      uses: actions/checkout@v4
      with:
        repository: wibblit-deployer/resume-tweaker
        token: ${{ secrets.ACCESS_TOKEN }}

    - name: Configure Git user
      run: |
        git config --global user.email "wibblit.deployer@protonmail.com"
        git config --global user.name "wibblit-deployer"

    - name: Add upstream repository
      run: |
        git remote add upstream https://github.com/Wibblit/resume-tweaker.git
        git fetch upstream
      env: 
        GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    - name: Create and switch to a temporary branch
      run: |
        git checkout -b temp-sync

    - name: Pull changes from upstream
      run: |
        git pull -X theirs --no-rebase --allow-unrelated-histories upstream main  # Prefer upstream changes in case of conflicts

    - name: Switch to main branch and reset to temp-sync
      run: |
        git checkout main
        git reset --hard temp-sync  # Reset main to match temp-sync exactly, including deletions

    - name: Commit changes with a timestamp
      run: |
        # Get the current timestamp in IST format (Indian Standard Time)
        TIMESTAMP=$(TZ='Asia/Kolkata' date +"%Y-%m-%dT%H:%M:%S%z")
        # Create a commit
        git commit --allow-empty -m "Sync with upstream - $TIMESTAMP" || echo "No changes to commit"

    - name: Push changes to forked repo
      run: |
        git push origin main --force
      env:
        GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
