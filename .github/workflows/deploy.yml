name: Sync with Upstream

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout forked repository
      uses: actions/checkout@v4
      with:
        repository: wibblit-deployer/resume-tweaker
        token: ${{ secrets.ACCESS_TOKEN }}
        fetch-depth: 0  # Ensure full history is available

    - name: Configure Git user
      run: |
        git config --global user.email "wibblit.deployer@protonmail.com"
        git config --global user.name "wibblit-deployer"

    - name: Add upstream repository
      run: |
        git remote add upstream https://github.com/Wibblit/resume-tweaker.git
        git fetch upstream
      env: 
        GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    - name: Create and switch to an empty branch
      run: |
        git checkout --orphan empty-branch  # Create an empty branch
        git rm -rf .  # Remove all files from the empty branch

    - name: Configure pull behavior
      run: |
        git config pull.rebase false  # Set pull behavior to merge

    - name: Pull changes from upstream into empty branch
      run: |
        git pull --allow-unrelated-histories upstream main  # Pull changes allowing unrelated histories

    - name: Switch to main branch and reset
      run: |
        git checkout main
        git reset --hard empty-branch  # Hard reset main to match empty-branch

    - name: Push changes to forked repo
      run: |
        git push origin main --force
      env:
        GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
